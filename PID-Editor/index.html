<!DOCTYPE html>
<html lang="ca">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Editor P&amp;ID</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <!-- Joc d'icones de la interfície. Totes comparteixen caixa (24×24),
       gruix de traç i acabat rodó, de manera que es llegeixen com una sola
       família. NO hi ha cap icona de símbol P&ID: els símbols del diagrama
       els dibuixa script.js i no es toquen des d'aquí. -->
  <svg class="icon-sprite" aria-hidden="true" focusable="false">
    <symbol id="i-undo" viewBox="0 0 24 24">
      <path d="M9 14 4 9l5-5" /><path d="M4 9h10a6 6 0 0 1 0 12h-3" />
    </symbol>
    <symbol id="i-redo" viewBox="0 0 24 24">
      <path d="m15 14 5-5-5-5" /><path d="M20 9H10a6 6 0 0 0 0 12h3" />
    </symbol>
    <symbol id="i-save" viewBox="0 0 24 24">
      <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2Z" />
      <path d="M17 21v-8H7v8" /><path d="M7 3v5h7" />
    </symbol>
    <symbol id="i-trash" viewBox="0 0 24 24">
      <path d="M4 7h16" /><path d="M9 7V5a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2" />
      <path d="m6 7 1 13a1 1 0 0 0 1 1h8a1 1 0 0 0 1-1l1-13" />
    </symbol>
    <symbol id="i-chevron" viewBox="0 0 24 24">
      <path d="m6 9 6 6 6-6" />
    </symbol>
    <symbol id="i-close" viewBox="0 0 24 24">
      <path d="M6 6 18 18" /><path d="M18 6 6 18" />
    </symbol>
    <symbol id="i-plus" viewBox="0 0 24 24">
      <path d="M12 5v14" /><path d="M5 12h14" />
    </symbol>
    <symbol id="i-minus" viewBox="0 0 24 24">
      <path d="M5 12h14" />
    </symbol>
    <symbol id="i-fit" viewBox="0 0 24 24">
      <path d="M4 9V6a2 2 0 0 1 2-2h3" /><path d="M15 4h3a2 2 0 0 1 2 2v3" />
      <path d="M20 15v3a2 2 0 0 1-2 2h-3" /><path d="M9 20H6a2 2 0 0 1-2-2v-3" />
    </symbol>
    <symbol id="i-clock" viewBox="0 0 24 24">
      <circle cx="12" cy="12" r="8.5" /><path d="M12 7.5V12l3 1.8" />
    </symbol>
    <symbol id="i-routes" viewBox="0 0 24 24">
      <circle cx="6" cy="12" r="2.5" /><circle cx="18" cy="6" r="2.5" />
      <circle cx="18" cy="18" r="2.5" />
      <path d="m8.3 10.8 7.4-3.6" /><path d="m8.3 13.2 7.4 3.6" />
    </symbol>
    <symbol id="i-play" viewBox="0 0 24 24">
      <path d="M8 5.5v13l11-6.5z" />
    </symbol>
    <symbol id="i-pause" viewBox="0 0 24 24">
      <path d="M9 5v14" /><path d="M15 5v14" />
    </symbol>
    <symbol id="i-stop" viewBox="0 0 24 24">
      <rect x="6" y="6" width="12" height="12" rx="1.5" />
    </symbol>
    <symbol id="i-add" viewBox="0 0 24 24">
      <path d="M12 5v14" /><path d="M5 12h14" />
    </symbol>
    <symbol id="i-up" viewBox="0 0 24 24">
      <path d="m6 14 6-6 6 6" />
    </symbol>
    <symbol id="i-down" viewBox="0 0 24 24">
      <path d="m6 10 6 6 6-6" />
    </symbol>
    <symbol id="i-undock" viewBox="0 0 24 24">
      <path d="M14 4h6v6" /><path d="m20 4-8 8" />
      <path d="M18 14v4a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4" />
    </symbol>
    <symbol id="i-dock" viewBox="0 0 24 24">
      <rect x="3" y="5" width="18" height="14" rx="2" /><path d="M3 14h18" />
    </symbol>
    <symbol id="i-refresh" viewBox="0 0 24 24">
      <path d="M20 11a8 8 0 0 0-13.7-5.2L3 9" /><path d="M3 4v5h5" />
      <path d="M4 13a8 8 0 0 0 13.7 5.2L21 15" /><path d="M21 20v-5h-5" />
    </symbol>
  </svg>

  <!-- Capçalera: títol a l'esquerra, controls agrupats a la dreta. Alçada
       fixa i sense vora: el que la separa del canvas és el fons blanc. -->
  <header class="app-header">
    <h1 class="app-header__title">Editor P&amp;ID</h1>

    <div class="app-header__actions">
      <div class="btn-group">
        <button id="undo-btn" type="button" class="btn btn--icon" title="Desfer (Ctrl+Z)" aria-label="Desfer" disabled>
          <svg class="icon" aria-hidden="true"><use href="#i-undo" /></svg>
        </button>
        <button id="redo-btn" type="button" class="btn btn--icon" title="Refer (Ctrl+Y)" aria-label="Refer" disabled>
          <svg class="icon" aria-hidden="true"><use href="#i-redo" /></svg>
        </button>
      </div>

      <span class="divider" aria-hidden="true"></span>

      <button id="clear-all" type="button" class="btn" title="Buida el canvas">
        <svg class="icon" aria-hidden="true"><use href="#i-trash" /></svg>
        Neteja tot
      </button>

      <button id="save-model" type="button" class="btn btn--primary"
              title="Desa el model en un arxiu .pid.json (Ctrl+S). Per obrir-lo, arrossega'l sobre el canvas.">
        <svg class="icon" aria-hidden="true"><use href="#i-save" /></svg>
        Desa
      </button>
    </div>
  </header>

  <!-- Barra d'eines: una sola línia. Les categories obren el seu menú en
       comptes de tenir tots els elements sempre a la vista, que és el que
       abans ocupava tres files. Els botons [data-tool] continuen vivint
       dins de .tool-groups encara que el menú estigui amagat, de manera que
       ni la delegació de clics ni typeLabel() de script.js han de saber res
       d'aquest canvi. -->
  <nav class="app-toolbar" aria-label="Elements del diagrama">
    <div class="tool-groups">
      <div class="tool-group">
        <button class="tool-group__trigger" type="button" aria-expanded="false" aria-controls="tools-elements">
          Elements
          <svg class="icon icon--chevron" aria-hidden="true"><use href="#i-chevron" /></svg>
        </button>
        <div class="tool-group__menu" id="tools-elements" hidden>
          <div class="tools">
            <button data-tool="pump">Bomba</button>
            <button data-tool="sieve">Cernedor</button>
            <button data-tool="bagdump">Descàrrega de sacs</button>
            <button data-tool="screwfeeder">Dosificador sensefí</button>
            <button data-tool="airlock">Esclusa rotativa</button>
            <button data-tool="valve">Vàlvula</button>
          </div>
        </div>
      </div>

      <div class="tool-group">
        <button class="tool-group__trigger" type="button" aria-expanded="false" aria-controls="tools-transport">
          Transport pneumàtic
          <svg class="icon icon--chevron" aria-hidden="true"><use href="#i-chevron" /></svg>
        </button>
        <div class="tool-group__menu" id="tools-transport" hidden>
          <div class="tools">
            <button data-tool="cyclone">Cicló</button>
            <button data-tool="diverter">Desviadora</button>
            <button data-tool="filter">Filtre transport</button>
            <button data-tool="injector">Injector</button>
          </div>
        </div>
      </div>

      <div class="tool-group">
        <button class="tool-group__trigger" type="button" aria-expanded="false" aria-controls="tools-storage">
          Emmagatzematge
          <svg class="icon icon--chevron" aria-hidden="true"><use href="#i-chevron" /></svg>
        </button>
        <div class="tool-group__menu" id="tools-storage" hidden>
          <div class="tools">
            <button data-tool="silo">Silo</button>
            <button data-tool="gravityhopper">Tolva de gravetat</button>
            <button data-tool="hopper">Tolva filtre</button>
            <button data-tool="trouserhopper">Tolva pantaló</button>
          </div>
        </div>
      </div>
    </div>

    <div class="app-toolbar__end">
      <button id="time-calc" type="button" class="btn btn--feature"
              title="Seqüència d'operacions i simulació en el temps"
              aria-expanded="false" aria-controls="sim-panel">
        <svg class="icon" aria-hidden="true"><use href="#i-clock" /></svg>
        Càlcul de temps
      </button>

      <button id="lines-toggle" type="button" class="btn btn--outline"
              aria-expanded="false" aria-controls="lines-panel">
        <svg class="icon" aria-hidden="true"><use href="#i-routes" /></svg>
        Línies de transport
      </button>
    </div>
  </nav>

  <main id="canvas-container">
    <svg id="canvas" width="100%" height="100%"></svg>

    <!-- Navegació del canvas: separada de la barra d'eines perquè és
         d'una altra mena de cosa (mirar el diagrama, no editar-lo). -->
    <div class="canvas-controls" role="group" aria-label="Navegació del canvas">
      <button id="zoom-in" type="button" class="btn" title="Apropa" aria-label="Apropa">
        <svg class="icon" aria-hidden="true"><use href="#i-plus" /></svg>
      </button>
      <button id="zoom-out" type="button" class="btn" title="Allunya" aria-label="Allunya">
        <svg class="icon" aria-hidden="true"><use href="#i-minus" /></svg>
      </button>
      <button id="zoom-fit" type="button" class="btn" title="Enquadra-ho tot" aria-label="Enquadra-ho tot">
        <svg class="icon" aria-hidden="true"><use href="#i-fit" /></svg>
      </button>
    </div>

    <!-- Resultat de desar/obrir: s'anuncia sol als lectors de pantalla. Va
         aquí i no a la capçalera perquè la capçalera es mantingui neta. -->
    <p id="file-note" class="file-note" role="status" aria-live="polite" hidden></p>
  </main>


  <!-- Interfície de simulació. Va acoblada a baix i no flotant com els
       altres panells: hi ha d'entrar un cronograma horitzontal i tres
       columnes d'informació, i així no tapa el diagrama sinó que li cedeix
       l'alçada que li cal. Tot el que hi surt ve de SimulationEngine; aquí
       no s'hi calcula ni un sol quilo. -->
  <section id="sim-panel" aria-labelledby="sim-title" hidden>
    <!-- Vora superior: arrossegar-la fa el panell més alt o més baix. -->
    <div id="sim-resize" class="sim-resize" role="separator" aria-orientation="horizontal"
         tabindex="0" aria-label="Canvia l'alçada del panell"></div>
    <header class="sim-bar">
      <h2 id="sim-title" class="sim-bar__title">
        <svg class="icon" aria-hidden="true"><use href="#i-clock" /></svg>
        Càlcul de temps
      </h2>

      <div class="sim-transport" role="group" aria-label="Reproducció">
        <button id="sim-play" type="button" class="btn btn--primary" title="Reprodueix">
          <svg class="icon" aria-hidden="true"><use href="#i-play" /></svg>
          Play
        </button>
        <button id="sim-pause" type="button" class="btn btn--outline" title="Pausa" aria-label="Pausa" disabled>
          <svg class="icon" aria-hidden="true"><use href="#i-pause" /></svg>
        </button>
        <button id="sim-stop" type="button" class="btn btn--outline" title="Atura i torna al principi" aria-label="Atura" disabled>
          <svg class="icon" aria-hidden="true"><use href="#i-stop" /></svg>
        </button>
      </div>

      <label class="sim-speed">
        <span class="sim-speed__label">Velocitat</span>
        <select id="sim-speed" class="process-field__input">
          <option value="0.25">0,25x</option>
          <option value="0.5">0,5x</option>
          <option value="1" selected>1x</option>
          <option value="2">2x</option>
          <option value="5">5x</option>
          <option value="10">10x</option>
        </select>
      </label>

      <p id="sim-clock" class="sim-clock" role="status" aria-live="off">00:00 / 00:00</p>

      <button id="sim-dock" type="button" class="lines-panel__close"
              title="Desancora la finestra" aria-label="Desancora la finestra">
        <svg class="icon" aria-hidden="true"><use id="sim-dock-icon" href="#i-undock" /></svg>
      </button>

      <button id="sim-close" type="button" class="lines-panel__close" title="Tanca" aria-label="Tanca la simulació">
        <svg class="icon" aria-hidden="true"><use href="#i-close" /></svg>
      </button>
    </header>

    <!-- Errors i avisos de la validació del motor. -->
    <div id="sim-issues" class="sim-issues" role="status" aria-live="polite" hidden></div>

    <!-- Cronograma: un bloc per acció, proporcional a la seva durada, amb
         el cursor arrossegable per sobre. -->
    <div class="sim-timeline">
      <div id="sim-ticks" class="sim-timeline__ticks"></div>
      <div id="sim-track" class="sim-timeline__track" role="slider" tabindex="0"
           aria-label="Cursor de temps" aria-valuemin="0" aria-valuenow="0" aria-valuemax="0">
        <div id="sim-blocks" class="sim-timeline__blocks"></div>
        <div id="sim-cursor" class="sim-timeline__cursor"></div>
      </div>
    </div>

    <div class="sim-columns">
      <!-- Editor de seqüència -->
      <section class="sim-col sim-col--sequence" aria-labelledby="sim-seq-title">
        <div class="sim-col__head">
          <h3 id="sim-seq-title" class="lines-panel__subtitle">Seqüència</h3>
          <span id="sim-total" class="sim-total">Total 00:00</span>
        </div>
        <div class="sim-table-wrap">
          <table class="sim-table">
            <thead>
              <tr><th>#</th><th>Acció</th><th>Línia</th><th>Durada</th><th>Estimació</th><th></th></tr>
            </thead>
            <tbody id="sim-rows"></tbody>
          </table>
          <p id="sim-empty" class="sim-hint">Encara no hi ha cap acció. Afegeix-ne una per començar.</p>
        </div>
        <button id="sim-add" type="button" class="lines-panel__recalc">
          <svg class="icon" aria-hidden="true"><use href="#i-add" /></svg>
          Afegeix una acció
        </button>
      </section>

      <!-- Acció actual -->
      <section class="sim-col" aria-labelledby="sim-now-title">
        <h3 id="sim-now-title" class="lines-panel__subtitle">Acció actual</h3>
        <dl id="sim-now" class="sim-facts"></dl>
      </section>

      <!-- Estat numèric del sistema -->
      <section class="sim-col" aria-labelledby="sim-state-title">
        <h3 id="sim-state-title" class="lines-panel__subtitle">Estat del sistema</h3>
        <div id="sim-state" class="sim-state"></div>
      </section>

      <!-- Resum: el mateix que es veu, però sumat. -->
      <section class="sim-col" aria-labelledby="sim-summary-title">
        <h3 id="sim-summary-title" class="lines-panel__subtitle">Resum</h3>
        <div id="sim-summary" class="sim-summary"></div>
      </section>
    </div>

    <!-- Cantonada per canviar amplada i alçada alhora. Només es veu quan
         la finestra està desancorada. -->
    <div id="sim-grip" class="sim-grip" aria-hidden="true"></div>
  </section>

  <!-- Panell de línies de transport: sobreposat al canvas (mateix patró que
       el menú contextual i els marcs de selecció, que també són HTML fix per
       sobre de l'SVG), de manera que no cal tocar el layout existent. -->
  <aside id="lines-panel" aria-labelledby="lines-panel-title" hidden>
    <div class="lines-panel__head">
      <h2 id="lines-panel-title" class="lines-panel__title">Línies de transport</h2>
      <button id="lines-close" type="button" class="lines-panel__close" title="Tanca" aria-label="Tanca el panell">
        <svg class="icon" aria-hidden="true"><use href="#i-close" /></svg>
      </button>
    </div>
    <button id="lines-recalc" type="button" class="lines-panel__recalc">
      <svg class="icon" aria-hidden="true"><use href="#i-refresh" /></svg>
      Recalcular
    </button>
    <!-- El resultat del recàlcul s'anuncia sol als lectors de pantalla. -->
    <p id="lines-note" class="lines-panel__note" role="status" aria-live="polite" hidden></p>
    <ul id="lines-list" class="lines-panel__list"></ul>
    <!-- Configuracions que ja no corresponen a cap línia detectada. No
         s'esborren soles: si es desfà el canvi al diagrama, la línia torna
         amb la seva configuració. Només es mostra quan n'hi ha. -->
    <div id="orphan-lines" class="lines-panel__orphans" hidden>
      <h3 class="lines-panel__subtitle">Configuracions sense línia</h3>
      <ul id="orphan-list" class="lines-panel__list"></ul>
    </div>
  </aside>

  <!-- Panell de configuració de procés: mateix patró que el de línies de
       transport (una targeta sobreposada al canvas), a l'altre costat de la
       pantalla perquè els dos puguin ser oberts alhora. El formulari es
       construeix a script.js a partir de l'esquema de ProcessModel, de
       manera que afegir un camp no demana tocar aquest HTML. -->
  <aside id="process-panel" aria-labelledby="process-panel-title" hidden>
    <div class="lines-panel__head">
      <h2 id="process-panel-title" class="lines-panel__title">Configuració</h2>
      <button id="process-close" type="button" class="lines-panel__close" title="Tanca" aria-label="Tanca el panell">
        <svg class="icon" aria-hidden="true"><use href="#i-close" /></svg>
      </button>
    </div>
    <p id="process-subject" class="process-panel__subject"></p>
    <form id="process-form" class="process-panel__form" novalidate></form>
    <div id="process-source" class="process-panel__source" hidden></div>
    <p id="process-note" class="lines-panel__note" role="status" aria-live="polite" hidden></p>
    <div class="process-panel__actions">
      <button id="process-save" type="submit" form="process-form" class="lines-panel__recalc">Desa</button>
      <button id="process-cancel" type="button" class="process-panel__cancel">Cancel·la</button>
    </div>
  </aside>

  <!-- Informació en passar el ratolí per sobre del diagrama amb la
       simulació aturada. És HTML fix per sobre de l'SVG, com el menú
       contextual i els marcs de selecció. -->
  <div id="sim-tip" class="sim-tip" role="tooltip" hidden></div>

  <script src="process.js"></script>
  <script src="simulation.js"></script>
  <script src="script.js"></script>
</body>
</html>
