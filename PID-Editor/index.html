<!DOCTYPE html>
<html lang="ca">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Editor P&amp;ID</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header id="toolbar">
    <div class="toolbar-top">
      <h1>Editor P&amp;ID</h1>
      <div class="toolbar-actions">
        <button id="clear-all" type="button">Neteja tot</button>
        <div class="history-controls">
          <button id="undo-btn" type="button" class="history-btn" title="Desfer" aria-label="Desfer" disabled>
            <svg viewBox="0 0 24 24" width="15" height="15" aria-hidden="true">
              <path d="M19 12H5M11 18l-6-6 6-6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
            </svg>
          </button>
          <button id="redo-btn" type="button" class="history-btn" title="Refer" aria-label="Refer" disabled>
            <svg viewBox="0 0 24 24" width="15" height="15" aria-hidden="true">
              <path d="M5 12h14M13 18l6-6-6-6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
            </svg>
          </button>
        </div>
        <button id="save-model" type="button" title="Desa el model en un arxiu .pid.json (Ctrl+S). Per obrir-lo, arrossega'l sobre el canvas.">Desa el model</button>
        <button id="lines-toggle" type="button" aria-expanded="false" aria-controls="lines-panel">Línies de transport</button>
        <!-- Resultat de desar/obrir: s'anuncia sol als lectors de pantalla. -->
        <p id="file-note" class="toolbar-note" role="status" aria-live="polite" hidden></p>
      </div>
    </div>
    <div class="tool-groups">
      <div class="tool-group">
        <span class="tool-group__label">Elements</span>
        <div class="tools">
          <button data-tool="pump">Bomba</button>
          <button data-tool="sieve">Cernedor</button>
          <button data-tool="bagdump">Descàrrega de sacs</button>
          <button data-tool="screwfeeder">Dosificador sensefí</button>
          <button data-tool="airlock">Esclusa rotativa</button>
          <button data-tool="valve">Vàlvula</button>
        </div>
      </div>
      <div class="tool-group">
        <span class="tool-group__label">Transport pneumàtic</span>
        <div class="tools">
          <button data-tool="cyclone">Cicló</button>
          <button data-tool="diverter">Desviadora</button>
          <button data-tool="filter">Filtre transport</button>
          <button data-tool="injector">Injector</button>
        </div>
      </div>
      <div class="tool-group">
        <span class="tool-group__label">Emmagatzematge</span>
        <div class="tools">
          <button data-tool="silo">Silo</button>
          <button data-tool="gravityhopper">Tolva de gravetat</button>
          <button data-tool="hopper">Tolva filtre</button>
          <button data-tool="trouserhopper">Tolva pantaló</button>
        </div>
      </div>
    </div>
  </header>

  <main id="canvas-container">
    <svg id="canvas" width="100%" height="100%"></svg>
  </main>

  <!-- Panell de línies de transport: sobreposat al canvas (mateix patró que
       el menú contextual i els marcs de selecció, que també són HTML fix per
       sobre de l'SVG), de manera que no cal tocar el layout existent. -->
  <aside id="lines-panel" aria-labelledby="lines-panel-title" hidden>
    <div class="lines-panel__head">
      <h2 id="lines-panel-title" class="lines-panel__title">Línies de transport</h2>
      <button id="lines-close" type="button" class="lines-panel__close" title="Tanca" aria-label="Tanca el panell">
        <span aria-hidden="true">×</span>
      </button>
    </div>
    <button id="lines-recalc" type="button" class="lines-panel__recalc">Recalcular</button>
    <!-- El resultat del recàlcul s'anuncia sol als lectors de pantalla. -->
    <p id="lines-note" class="lines-panel__note" role="status" aria-live="polite" hidden></p>
    <ul id="lines-list" class="lines-panel__list"></ul>
    <!-- Configuracions que ja no corresponen a cap línia detectada. No
         s'esborren soles: si es desfà el canvi al diagrama, la línia torna
         amb la seva configuració. Només es mostra quan n'hi ha. -->
    <div id="orphan-lines" class="lines-panel__orphans" hidden>
      <h3 class="lines-panel__subtitle">Configuracions sense línia</h3>
      <ul id="orphan-list" class="lines-panel__list"></ul>
    </div>
  </aside>

  <!-- Panell de configuració de procés: mateix patró que el de línies de
       transport (una targeta sobreposada al canvas), a l'altre costat de la
       pantalla perquè els dos puguin ser oberts alhora. El formulari es
       construeix a script.js a partir de l'esquema de ProcessModel, de
       manera que afegir un camp no demana tocar aquest HTML. -->
  <aside id="process-panel" aria-labelledby="process-panel-title" hidden>
    <div class="lines-panel__head">
      <h2 id="process-panel-title" class="lines-panel__title">Configuració</h2>
      <button id="process-close" type="button" class="lines-panel__close" title="Tanca" aria-label="Tanca el panell">
        <span aria-hidden="true">×</span>
      </button>
    </div>
    <p id="process-subject" class="process-panel__subject"></p>
    <form id="process-form" class="process-panel__form" novalidate></form>
    <div id="process-source" class="process-panel__source" hidden></div>
    <p id="process-note" class="lines-panel__note" role="status" aria-live="polite" hidden></p>
    <div class="process-panel__actions">
      <button id="process-save" type="submit" form="process-form" class="lines-panel__recalc">Desa</button>
      <button id="process-cancel" type="button" class="process-panel__cancel">Cancel·la</button>
    </div>
  </aside>

  <script src="process.js"></script>
  <script src="script.js"></script>
</body>
</html>
